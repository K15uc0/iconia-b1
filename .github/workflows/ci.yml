name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make lint test relay
      - uses: actions/upload-artifact@v4
        with:
          name: iconia-relay
          path: build/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/* --generate-notes || gh release upload "$GITHUB_REF_NAME" build/* --clobber
